<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - OVERTIME KOBE</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    body {
        font-family: 'Poppins', sans-serif;
        background: linear-gradient(135deg, #1a252f 0%, #2c3e50 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0;
        position: relative;
        overflow: hidden;
    }
    .shape {
        position: absolute;
        border-radius: 50%;
        filter: blur(80px);
        z-index: 0;
        animation: float 6s ease-in-out infinite;
    }
    .shape-1 {
        width: 400px; height: 400px;
        background: rgba(26, 188, 156, 0.15); 
        top: -100px; left: -100px;
    }
    .shape-2 {
        width: 500px; height: 500px;
        background: rgba(52, 152, 219, 0.15); 
        bottom: -150px; right: -100px;
        animation-delay: -3s;
    }
    @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-20px); }
        100% { transform: translateY(0px); }
    }
    .login-container {
        width: 100%;
        max-width: 400px;
        padding: 2.5rem 2rem;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        z-index: 1;
        position: relative;
    }
    .logo-container {
        text-align: center;
        margin-bottom: 2rem;
    }
    .logo-container img {
        max-width: 220px;
        height: auto;
        margin-bottom: 0.5rem;
    }
    .logo-container h5 {
        font-weight: 700;
        color: #2c3e50;
        font-size: 1.1rem;
        letter-spacing: 1.5px;
        margin-top: 15px;
    }
    .garis-bawah {
        width: 50px; height: 4px; background: #1abc9c;
        margin: 0 auto 20px auto; border-radius: 2px;
    }
    .form-floating > label {
        color: #7f8c8d; font-weight: 500; padding-left: 15px;
    }
    .form-control {
        border-radius: 10px; border: 2px solid #ecf0f1;
        padding: 1rem 1rem; font-weight: 500; color: #2c3e50;
        transition: all 0.3s ease;
    }
    .form-control:focus {
        border-color: #1abc9c; box-shadow: 0 0 0 0.25rem rgba(26, 188, 156, 0.15);
        background-color: #fcfcfc;
    }
    .icon-input {
        position: absolute; right: 15px; top: 50%;
        transform: translateY(-50%); color: #bdc3c7;
        font-size: 1.2rem; transition: 0.3s;
    }
    .form-control:focus ~ .icon-input { color: #1abc9c; }
    
    .btn-login {
        background: linear-gradient(135deg, #1abc9c, #16a085);
        border: none; border-radius: 10px; padding: 14px;
        font-weight: 600; letter-spacing: 1px; color: white;
        font-size: 1.1rem; transition: all 0.3s ease; margin-top: 10px;
    }
    .btn-login:hover {
        background: linear-gradient(135deg, #16a085, #1abc9c);
        transform: translateY(-3px); box-shadow: 0 8px 20px rgba(26, 188, 156, 0.4); color: white;
    }
    .btn-login:disabled { background: #95a5a6; transform: none; box-shadow: none; }
    
    .reset-link {
        display: block; text-align: center; margin-top: 1.5rem;
        color: #e74c3c; text-decoration: none; font-size: 0.85rem;
        font-weight: 600; transition: all 0.3s; padding: 10px; border-radius: 8px;
    }
    .reset-link:hover { color: #c0392b; background-color: rgba(231, 76, 60, 0.05); }
  </style>
</head>
<body>

  <div class="shape shape-1"></div>
  <div class="shape shape-2"></div>

  <div class="login-container">
    <div class="logo-container">
      <img src="https://kobexindo.com/wp-content/uploads/kobexindo_logo-300x69.png" alt="Logo Kobexindo">
      <h5>HRIS OVERTIME</h5>
      <div class="garis-bawah"></div>
    </div>

    <form id="loginForm">
      <div class="form-floating mb-3 position-relative">
        <input type="text" class="form-control" id="nrpp" placeholder="NRPP Karyawan" autocomplete="off" required>
        <label for="nrpp">NRPP Karyawan</label>
        <i class="bi bi-person-badge icon-input"></i>
      </div>

      <div class="form-floating mb-4 position-relative">
        <input type="password" class="form-control" id="password" placeholder="Password / PIN" required>
        <label for="password">Password / PIN</label>
        <i class="bi bi-key icon-input"></i>
      </div>

      <button type="submit" class="btn w-100 btn-login" id="btnLogin">
        MASUK <i class="bi bi-arrow-right-circle ms-1"></i>
      </button>
      
      <a href="#" onclick="bukaKunciAdmin()" class="reset-link">
        <i class="bi bi-shield-lock-fill me-1"></i> Buka Kunci Perangkat (Reset)
      </a>
    </form>
  </div>

  <script>
    // --- 1. LOGIK RESET DEVICE ---
    function bukaKunciAdmin() {
      const pin = prompt("Masukkan PIN Admin untuk mereset perangkat ini:");
      if (pin === "ADMIN123") { 
        localStorage.removeItem("device_locked_nrpp");
        localStorage.removeItem("absen_selesai_tanggal");
        alert("✅ Sukses! Perangkat telah di-reset.");
      } else if (pin !== null) {
        alert("❌ PIN Admin Salah!");
      }
    }

    // --- 2. LOGIKA LOGIN YANG SUDAH DIOPTIMALKAN TRANISISNYA ---
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault(); 
      
      const nrpp = document.getElementById('nrpp').value;
      const password = document.getElementById('password').value;
      const btn = document.getElementById('btnLogin');
      
      // Cek Kunci Perangkat
      const hpDikunciUntuk = localStorage.getItem("device_locked_nrpp");
      if (hpDikunciUntuk && hpDikunciUntuk !== nrpp) {
        alert("❌ DITOLAK: Smartphone ini sudah dikunci untuk NRPP " + hpDikunciUntuk);
        return; 
      }

      // Animasi Loading Tahap 1
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Memeriksa Data...';

      google.script.run
        .withSuccessHandler(function(res) {
          if (res.status === "SUCCESS") {
            
            // Kunci perangkat jika berhasil login pertama kali
            if (!hpDikunciUntuk) { localStorage.setItem("device_locked_nrpp", nrpp); }

            // Menyimpan Data Sesi
            sessionStorage.setItem("user_nrpp", nrpp);
            sessionStorage.setItem("user_nama", res.nama);
            sessionStorage.setItem("user_role", res.role); 
            
            // Animasi Loading Tahap 2 (Memuat Dashboard)
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Menyiapkan Dashboard...';
            
            google.script.run
              .withSuccessHandler(function(htmlContent) {
                document.body.innerHTML = htmlContent;
                const scripts = document.body.getElementsByTagName("script");
                for (let i = 0; i < scripts.length; i++) { eval(scripts[i].innerText); }
              })
              .getHtmlPage('Dashboard');

          } else {
            // Jika Gagal Login
            btn.disabled = false;
            btn.innerHTML = 'MASUK <i class="bi bi-arrow-right-circle ms-1"></i>';
            alert(res.message);
          }
        })
        .withFailureHandler(function(err) {
          btn.disabled = false;
          btn.innerHTML = 'MASUK <i class="bi bi-arrow-right-circle ms-1"></i>';
          alert("Terjadi kesalahan sistem: " + err);
        })
        .prosesLogin(nrpp, password);
    });
  </script>
</body>
</html>
